/* ═══ Data Access ═══ */
function getEmbeddedData() {
  const raw = window.__PORTFOLIO_DATA__;
  if (!raw) return null;
  return {
    content: raw.content || {},
    customProjects: raw.customProjects || [],
    projectOrder: raw.projectOrder || [],
    mediaIds: raw.mediaIds || [],
    previewIds: raw.previewIds || [],
  };
}

/* ═══ Async data loader (loads from assets/ files) ═══ */
async function loadPortfolioData() {
  const embedded = getEmbeddedData();
  if (!embedded) return { content:{}, customProjects:[], projectOrder:{}, mediaData:{}, previewData:{} };

  const mediaData = {};
  const previewData = {};

  // Load media files in parallel
  const mediaPromises = (embedded.mediaIds || []).map(async (pid) => {
    try {
      const res = await fetch('assets/media-' + pid + '.json');
      if (res.ok) {
        const text = await res.text();
        mediaData['project-edit-' + pid] = text;
      }
    } catch (e) { console.warn('[portfolio] Failed to load media for', pid, e); }
  });

  const previewPromises = (embedded.previewIds || []).map(async (pid) => {
    try {
      const res = await fetch('assets/preview-' + pid + '.txt');
      if (res.ok) {
        previewData[pid] = await res.text();
      }
    } catch (e) { console.warn('[portfolio] Failed to load preview for', pid, e); }
  });

  await Promise.all([...mediaPromises, ...previewPromises]);

  return {
    content: embedded.content,
    customProjects: embedded.customProjects,
    projectOrder: embedded.projectOrder,
    mediaData,
    previewData,
  };
}

/* ═══ Hash Router ═══ */
function useHashRouter() {
  const [route, setRoute] = React.useState(() => {
    const h = window.location.hash.slice(1) || '/';
    return h;
  });
  React.useEffect(() => {
    const handler = () => setRoute(window.location.hash.slice(1) || '/');
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);
  const navigate = (path) => { window.location.hash = path; };
  return { route, navigate };
}

/* ═══ IntersectionObserver hook ═══ */
function useInView(threshold = 0.15) {
  const ref = React.useRef(null);
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.unobserve(el); } }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold]);
  return { ref, visible };
}

function ProjectDetailPage({ data, navigate, projectId }) {

    if (!project) return;
    const mediaKey = 'project-edit-' + project.id;
    const rawMedia = data?.mediaData?.[mediaKey];
    if (rawMedia) {
      try {
        const parsed = typeof rawMedia === 'string' ? JSON.parse(rawMedia) : rawMedia;
        setEditData(parsed);
      } catch (e) {
        console.error('[portfolio] Failed to parse edit data for', project.id, e);

/* ═══ App ═══ */
function App() {
  const { route, navigate } = useHashRouter();
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(true);

  React.useEffect(() => {
    loadPortfolioData().then((loaded) => {
      const content = loaded.content;
      const customProjects = loaded.customProjects;
      const projectOrder = loaded.projectOrder;
      const mediaData = loaded.mediaData;

      // Build preview map
      const previewMap = {};
      for (const [pid, src] of Object.entries(loaded.previewData || {})) {
        if (src) previewMap[pid] = src;
      }
      for (const [key, rawMedia] of Object.entries(mediaData || {})) {
        if (!key.startsWith('project-edit-')) continue;
        const pid = key.replace('project-edit-', '');
        if (previewMap[pid]) continue;
        try {
          const editObj = typeof rawMedia === 'string' ? JSON.parse(rawMedia) : rawMedia;
          if (editObj?.cover?.src) {
            previewMap[pid] = editObj.cover.src;
          } else if (editObj?.items?.length) {
            const firstImage = editObj.items.find(it => it.type === 'image' && it.src);
            if (firstImage) previewMap[pid] = firstImage.src;
          }
        } catch {}
      }

      setData({ content, customProjects, projectOrder, mediaData, previewMap });
      setLoading(false);
    }).catch(() => setLoading(false));
  }, []);

  if (loading) return <LoadingScreen/>;

  const projectIdMatch = route.match(/^[/]project[/](.+)$/);
  if (projectIdMatch) {
    return <ProjectDetailPage data={data} navigate={navigate} projectId={projectIdMatch[1]}/>;
  }
  return <HomePage data={data} navigate={navigate}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
